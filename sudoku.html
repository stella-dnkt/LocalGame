
<style>
#sw3{padding:1rem 0;font-family:sans-serif;}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
.gw{display:flex;justify-content:center;margin-bottom:1rem;}
table#sg{border-collapse:collapse;border:3px solid #333;}
table#sg td{
  width:38px;height:38px;text-align:center;vertical-align:middle;
  font-size:18px;font-weight:500;cursor:pointer;
  border:1px solid #aaa;background:#fff;color:#222;
  box-sizing:border-box;
}
table#sg tr:nth-child(3n) td{border-bottom:3px solid #333;}
table#sg td:nth-child(3n){border-right:3px solid #333;}
table#sg td.given{color:#222;pointer-events:none;font-weight:700;}
table#sg td.sel{background:#90bce8;}
table#sg td.hl{background:#e8f0f8;}
table#sg td.sn{background:#b8d4ea;}
table#sg td.err{color:#d32;}
table#sg td.hnt{color:#1a7;}
.np{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:1rem;}
.np button,.ctrl button,.df button{
  border:1px solid #bbb;border-radius:6px;background:#fff;color:#222;
  cursor:pointer;font-size:14px;padding:0;
}
.np button{width:36px;height:36px;font-size:16px;}
.np button:hover,.ctrl button:hover,.df button:hover{background:#eee;}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:.5rem;}
.ctrl button{font-size:13px;padding:6px 14px;}
.df{display:flex;gap:8px;justify-content:center;margin-bottom:1rem;}
.df button{font-size:13px;padding:5px 14px;}
.df button.act{background:#dceeff;border-color:#5599cc;color:#1155aa;}
#st{text-align:center;font-size:14px;color:#555;min-height:22px;}
.win{color:#1a7;font-weight:600;font-size:16px;}
</style>

<div id="sw3">
<h2 class="sr-only">数独ゲーム</h2>
<div class="df">
  <button class="act" onclick="setDiff('easy')">かんたん</button>
  <button onclick="setDiff('medium')">ふつう</button>
  <button onclick="setDiff('hard')">むずかしい</button>
</div>
<div class="gw"><table id="sg"></table></div>
<div class="np">
  <button onclick="inp(1)">1</button><button onclick="inp(2)">2</button>
  <button onclick="inp(3)">3</button><button onclick="inp(4)">4</button>
  <button onclick="inp(5)">5</button><button onclick="inp(6)">6</button>
  <button onclick="inp(7)">7</button><button onclick="inp(8)">8</button>
  <button onclick="inp(9)">9</button><button onclick="inp(0)">✕</button>
</div>
<div class="ctrl">
  <button onclick="newGame()">新しいゲーム</button>
  <button onclick="hint()">ヒント ↗</button>
  <button onclick="chk()">答え合わせ</button>
</div>
<div id="st"></div>
</div>

<script>
let sol=[],puz=[],ug=[],sel=null,diff='easy',won=false;

function setDiff(d){
  diff=d;
  document.querySelectorAll('.df button').forEach(b=>{
    b.classList.toggle('act',b.textContent.trim()==={easy:'かんたん',medium:'ふつう',hard:'むずかしい'}[d]);
  });
  newGame();
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function ok(b,r,c,n){
  for(let i=0;i<9;i++)if(b[r][i]===n||b[i][c]===n)return false;
  const br=r-r%3,bc=c-c%3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(b[br+i][bc+j]===n)return false;
  return true;
}
function slv(b){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(b[r][c]===0){
    for(const n of shuf([1,2,3,4,5,6,7,8,9])){
      if(ok(b,r,c,n)){b[r][c]=n;if(slv(b))return true;b[r][c]=0;}
    }
    return false;
  }
  return true;
}
function gen(){
  const b=Array.from({length:9},()=>Array(9).fill(0));
  slv(b);sol=b.map(r=>[...r]);
  const keep={easy:38,medium:30,hard:24}[diff];
  puz=b.map(r=>[...r]);
  shuf([...Array(81).keys()]).slice(0,81-keep).forEach(i=>{puz[i/9|0][i%9]=0;});
  ug=puz.map(r=>[...r]);
}
function render(){
  const t=document.getElementById('sg');t.innerHTML='';
  for(let r=0;r<9;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<9;c++){
      const td=document.createElement('td');
      if(puz[r][c])td.classList.add('given');
      if(ug[r][c])td.textContent=ug[r][c];
      td.dataset.r=r;td.dataset.c=c;
      td.onclick=()=>{if(!won){sel={r,c};hl();}};
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  hl();
}
function hl(){
  document.querySelectorAll('#sg td').forEach(td=>{
    const r=+td.dataset.r,c=+td.dataset.c;
    td.classList.remove('sel','hl','sn','err','hnt');
    if(!sel)return;
    const {r:sr,c:sc}=sel,sv=ug[sr][sc];
    if(r===sr&&c===sc)td.classList.add('sel');
    else if(r===sr||c===sc||r-r%3===sr-sr%3&&c-c%3===sc-sc%3)td.classList.add('hl');
    if(sv&&ug[r][c]===sv&&!(r===sr&&c===sc))td.classList.add('sn');
    if(puz[r][c]===0&&ug[r][c]&&ug[r][c]!==sol[r][c])td.classList.add('err');
  });
}
function inp(n){
  if(!sel||won)return;
  const{r,c}=sel;if(puz[r][c])return;
  ug[r][c]=n;
  const td=document.querySelector(`#sg td[data-r="${r}"][data-c="${c}"]`);
  td.textContent=n||'';td.classList.remove('hnt');
  hl();cwin();
}
function cwin(){
  if(sol.every((row,r)=>row.every((v,c)=>v===ug[r][c]))){
    won=true;document.getElementById('st').innerHTML='<span class="win">🎉 おめでとう！クリアしました！</span>';
  }
}
function chk(){
  let e=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(ug[r][c]&&ug[r][c]!==sol[r][c])e++;
  const s=document.getElementById('st');
  s.textContent=e?`${e}か所まちがいがあります。`:'ミスなし！この調子で！';
  setTimeout(()=>{if(!won)s.textContent='';},2500);
}
function hint(){
  const em=[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!ug[r][c])em.push({r,c});
  if(!em.length)return;
  const{r,c}=em[0|Math.random()*em.length];
  ug[r][c]=sol[r][c];
  const td=document.querySelector(`#sg td[data-r="${r}"][data-c="${c}"]`);
  td.textContent=sol[r][c];td.classList.add('hnt');
  sel={r,c};hl();cwin();
}
function newGame(){
  won=false;sel=null;document.getElementById('st').textContent='';
  gen();render();
}
document.addEventListener('keydown',e=>{
  if(!sel||won)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=9)inp(n);
  else if(['Backspace','Delete','0'].includes(e.key))inp(0);
});
newGame();
</script>
