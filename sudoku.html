<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数独</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;display:flex;justify-content:center;padding:4px 4px 1rem;transition:background .2s;}

/* ── WHITE ── */
body.theme-white{background:#fff;}
body.theme-white table#sg{border:3px solid #333;}
body.theme-white table#sg td{background:#fff;color:#222;border:1px solid #aaa;}
body.theme-white table#sg tr:nth-child(3n) td{border-bottom:3px solid #333;}
body.theme-white table#sg td:nth-child(3n){border-right:3px solid #333;}
body.theme-white table#sg td.given{color:#222;}
body.theme-white table#sg td.sel{background:#90bce8;}
body.theme-white table#sg td.hl{background:#e8f0f8;}
body.theme-white table#sg td.sn{background:#b8d4ea;}
body.theme-white table#sg td.err{color:#d32;}
body.theme-white table#sg td.hnt{color:#1a7;}
body.theme-white .np button,.theme-white .ctrl button,.theme-white .df button{background:#fff;color:#222;border:1px solid #bbb;}
body.theme-white .df button.act{background:#dceeff;border-color:#5599cc;color:#1155aa;}
body.theme-white .opts label{color:#444;}
body.theme-white .themes span{color:#444;}
body.theme-white .divider{border-top:1px solid #ddd;}
body.theme-white #st{color:#555;}

/* ── GRAY ── */
body.theme-gray{background:#6b6b6b;}
body.theme-gray table#sg{border:3px solid #444;}
body.theme-gray table#sg td{background:#a0a0a0;color:#111;border:1px solid #888;}
body.theme-gray table#sg tr:nth-child(3n) td{border-bottom:3px solid #444;}
body.theme-gray table#sg td:nth-child(3n){border-right:3px solid #444;}
body.theme-gray table#sg td.given{color:#111;}
body.theme-gray table#sg td.sel{background:#7ab0d8;}
body.theme-gray table#sg td.hl{background:#8f8f8f;}
body.theme-gray table#sg td.sn{background:#8ab0c8;}
body.theme-gray table#sg td.err{color:#c00;}
body.theme-gray table#sg td.hnt{color:#085;}
body.theme-gray .np button,.theme-gray .ctrl button,.theme-gray .df button{background:#a0a0a0;color:#111;border:1px solid #888;}
body.theme-gray .df button.act{background:#7aaac8;border-color:#4477aa;color:#001833;}
body.theme-gray .opts label{color:#111;}
body.theme-gray .themes span{color:#111;}
body.theme-gray .divider{border-top:1px solid #888;}
body.theme-gray #st{color:#111;}

/* ── BLACK ── */
body.theme-black{background:#000;}
body.theme-black table#sg{border:3px solid #fff;}
body.theme-black table#sg td{background:#000;color:#fff;border:1px solid #555;}
body.theme-black table#sg tr:nth-child(3n) td{border-bottom:3px solid #fff;}
body.theme-black table#sg td:nth-child(3n){border-right:3px solid #fff;}
body.theme-black table#sg td.given{color:#fff;}
body.theme-black table#sg td.sel{background:#1a4a7a;}
body.theme-black table#sg td.hl{background:#1a1a1a;}
body.theme-black table#sg td.sn{background:#0f3358;}
body.theme-black table#sg td.err{color:#f55;}
body.theme-black table#sg td.hnt{color:#3d9;}
body.theme-black .np button,.theme-black .ctrl button,.theme-black .df button{background:#000;color:#fff;border:1px solid #555;}
body.theme-black .df button.act{background:#1a3a5a;border-color:#5599cc;color:#8bc8ff;}
body.theme-black .opts label{color:#ccc;}
body.theme-black .themes span{color:#ccc;}
body.theme-black .divider{border-top:1px solid #444;}
body.theme-black #st{color:#aaa;}

/* 共通 */
#app{width:100%;max-width:480px;}
.df{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}
.df button{flex:1;font-size:13px;padding:6px 0;border-radius:6px;cursor:pointer;}
.gw{display:flex;justify-content:center;margin-bottom:8px;}
table#sg{border-collapse:collapse;}
table#sg td{text-align:center;vertical-align:middle;font-weight:500;cursor:pointer;}
table#sg td.given{pointer-events:none;font-weight:700;}
.np{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px;}
.np button{aspect-ratio:1;font-size:1.2rem;font-weight:500;border-radius:6px;cursor:pointer;}
.np button:active{opacity:.7;}
.ctrl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
.ctrl button{font-size:13px;padding:7px 14px;border-radius:6px;cursor:pointer;}
.ctrl button:active{opacity:.7;}
#st{text-align:center;font-size:14px;min-height:20px;margin-bottom:8px;}
.win{color:#1a7;font-weight:600;font-size:16px;}
.divider{border:none;margin:8px 0;}
.opts{display:flex;gap:10px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
.opts label{font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.themes{display:flex;gap:8px;justify-content:center;align-items:center;padding-top:4px;}
.themes span{font-size:13px;margin-right:4px;}
.themes button{width:28px;height:28px;border-radius:50%;cursor:pointer;outline:3px solid transparent;outline-offset:2px;transition:outline .15s;}
.themes button.act{outline-color:#5599cc;}
.themes button.tw{background:#fff;border:1px solid #bbb;}
.themes button.tg{background:#a0a0a0;border:1px solid #666;}
.themes button.tb{background:#000;border:1px solid #555;}
</style>
</head>
<body class="theme-white">
<div id="app">
  <div class="df">
    <button class="act" onclick="setDiff('easy')">かんたん</button>
    <button onclick="setDiff('medium')">ふつう</button>
    <button onclick="setDiff('hard')">むずかしい</button>
  </div>
  <div class="gw"><table id="sg"></table></div>
  <div class="np">
    <button onclick="inp(1)">1</button>
    <button onclick="inp(2)">2</button>
    <button onclick="inp(3)">3</button>
    <button onclick="inp(4)">4</button>
    <button onclick="inp(5)">5</button>
    <button onclick="inp(6)">6</button>
    <button onclick="inp(7)">7</button>
    <button onclick="inp(8)">8</button>
    <button onclick="inp(9)">9</button>
    <button onclick="inp(0)">✕</button>
  </div>
  <div class="ctrl">
    <button onclick="newGame()">新しいゲーム</button>
    <button onclick="hint()">ヒント</button>
    <button onclick="chk()">答え合わせ</button>
  </div>
  <div id="st"></div>
  <hr class="divider">
  <div class="opts">
    <label><input type="checkbox" id="optHL" checked> 同列・同行ハイライト</label>
    <label><input type="checkbox" id="optSN" checked> 同数ハイライト</label>
  </div>
  <div class="themes">
    <span>背景</span>
    <button class="tw act" onclick="setTheme('white')" title="白"></button>
    <button class="tg"     onclick="setTheme('gray')"  title="グレー"></button>
    <button class="tb"     onclick="setTheme('black')" title="黒"></button>
  </div>
</div>

<script>
let sol=[],puz=[],ug=[],sel=null,diff='easy',won=false;

function setTheme(t){
  document.body.className='theme-'+t;
  document.querySelectorAll('.themes button').forEach(b=>b.classList.remove('act'));
  document.querySelector('.themes button.t'+t[0]).classList.add('act');
}
function resizeCells(){
  const w=document.getElementById('app').clientWidth-8;
  const size=Math.floor(Math.min(w,440)/9);
  document.querySelectorAll('#sg td').forEach(td=>{
    td.style.width=size+'px';
    td.style.height=size+'px';
    td.style.fontSize=Math.floor(size*.5)+'px';
  });
}
function setDiff(d){
  diff=d;
  document.querySelectorAll('.df button').forEach(b=>{
    b.classList.toggle('act',b.textContent.trim()==={easy:'かんたん',medium:'ふつう',hard:'むずかしい'}[d]);
  });
  newGame();
}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function ok(b,r,c,n){
  for(let i=0;i<9;i++)if(b[r][i]===n||b[i][c]===n)return false;
  const br=r-r%3,bc=c-c%3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(b[br+i][bc+j]===n)return false;
  return true;
}
function slv(b){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(b[r][c]===0){
    for(const n of shuf([1,2,3,4,5,6,7,8,9])){
      if(ok(b,r,c,n)){b[r][c]=n;if(slv(b))return true;b[r][c]=0;}
    }
    return false;
  }
  return true;
}
function gen(){
  const b=Array.from({length:9},()=>Array(9).fill(0));
  slv(b);sol=b.map(r=>[...r]);
  const keep={easy:38,medium:30,hard:24}[diff];
  puz=b.map(r=>[...r]);
  shuf([...Array(81).keys()]).slice(0,81-keep).forEach(i=>{puz[i/9|0][i%9]=0;});
  ug=puz.map(r=>[...r]);
}
function render(){
  const t=document.getElementById('sg');t.innerHTML='';
  for(let r=0;r<9;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<9;c++){
      const td=document.createElement('td');
      if(puz[r][c])td.classList.add('given');
      if(ug[r][c])td.textContent=ug[r][c];
      td.dataset.r=r;td.dataset.c=c;
      td.onclick=()=>{if(!won){sel={r,c};hl();}};
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  resizeCells();hl();
}
function hl(){
  const useHL=document.getElementById('optHL').checked;
  const useSN=document.getElementById('optSN').checked;
  document.querySelectorAll('#sg td').forEach(td=>{
    const r=+td.dataset.r,c=+td.dataset.c;
    td.classList.remove('sel','hl','sn','err','hnt');
    if(!sel)return;
    const{r:sr,c:sc}=sel,sv=ug[sr][sc];
    if(r===sr&&c===sc){td.classList.add('sel');}
    else{
      if(useHL&&(r===sr||c===sc||r-r%3===sr-sr%3&&c-c%3===sc-sc%3))td.classList.add('hl');
      if(useSN&&sv&&ug[r][c]===sv)td.classList.add('sn');
    }
    if(puz[r][c]===0&&ug[r][c]&&ug[r][c]!==sol[r][c])td.classList.add('err');
  });
}
function inp(n){
  if(!sel||won)return;
  const{r,c}=sel;if(puz[r][c])return;
  ug[r][c]=n;
  const td=document.querySelector(`#sg td[data-r="${r}"][data-c="${c}"]`);
  td.textContent=n||'';td.classList.remove('hnt');
  hl();cwin();
}
function cwin(){
  if(sol.every((row,r)=>row.every((v,c)=>v===ug[r][c]))){
    won=true;document.getElementById('st').innerHTML='<span class="win">🎉 おめでとう！クリアしました！</span>';
  }
}
function chk(){
  let e=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(ug[r][c]&&ug[r][c]!==sol[r][c])e++;
  const s=document.getElementById('st');
  s.textContent=e?`${e}か所まちがいがあります。`:'ミスなし！この調子で！';
  setTimeout(()=>{if(!won)s.textContent='';},2500);
}
function hint(){
  const em=[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!ug[r][c])em.push({r,c});
  if(!em.length)return;
  const{r,c}=em[0|Math.random()*em.length];
  ug[r][c]=sol[r][c];
  const td=document.querySelector(`#sg td[data-r="${r}"][data-c="${c}"]`);
  td.textContent=sol[r][c];td.classList.add('hnt');
  sel={r,c};hl();cwin();
}
function newGame(){
  won=false;sel=null;document.getElementById('st').textContent='';
  gen();render();
}
document.addEventListener('keydown',e=>{
  if(!sel||won)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=9)inp(n);
  else if(['Backspace','Delete','0'].includes(e.key))inp(0);
});
document.getElementById('optHL').addEventListener('change',hl);
document.getElementById('optSN').addEventListener('change',hl);
window.addEventListener('resize',resizeCells);
newGame();
</script>
</body>
</html>
